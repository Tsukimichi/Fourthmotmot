<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4THMOTMOT</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Press Start 2P",monospace;background:linear-gradient(#06091b,#10183a,#1b1d4d);min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;color:#f7e8c3}
.stars{position:fixed;inset:0;background-image:radial-gradient(white 1px,transparent 1px),radial-gradient(#ffd6f3 1px,transparent 1px);background-size:120px 120px,240px 240px;animation:twinkle 4s infinite alternate}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}
.moon{position:fixed;top:40px;left:-90px;width:80px;height:80px;border-radius:50%;background:#f8efc8;box-shadow:0 0 25px #fff0b0;animation:moon 20s linear infinite}
@keyframes moon{to{transform:translateX(calc(100vw + 180px))}}
.envelope{position:relative;width:min(92vw,520px);height:340px;cursor:pointer}
.back{position:absolute;inset:0;background:#f5ead0;border:6px solid #8b6b3f;border-radius:10px}
.flap{position:absolute;inset:0;transform-origin:top;transition:1.2s;z-index:3}
.flap:before{content:"";position:absolute;inset:0;background:#e2cfa3;clip-path:polygon(0 0,100% 0,50% 58%)}
.seal{position:absolute;left:50%;top:118px;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:#7a1f2b;border:4px solid #d7b36a;display:flex;align-items:center;justify-content:center;z-index:4}
.letter{position:absolute;left:12px;right:12px;bottom:-430px;height:420px;background:#fffaf0;border:4px solid #b79b63;border-radius:8px;overflow:auto;transition:bottom 1.2s;display:flex;flex-direction:column}
.header{padding:12px;text-align:center;color:#5b3b20;border-bottom:3px solid #d7c39a}
.header h1{font-size:12px;margin-bottom:6px}.header p{font-size:8px;line-height:1.5}
.photo{width:100%;height:auto;display:block;opacity:0;transition:.8s ease}
.poem{padding:14px;background:rgba(8,10,24,.72);color:#fff7dc;font-size:7px;line-height:1.9;opacity:0;transition:.8s}
.poem p{margin-bottom:10px}.final{text-align:center;color:#ffe6f2}
.open .flap{transform:rotateX(-180deg)}
.open .letter{bottom:18px}
.open .photo,.open .poem{opacity:1}
.open .seal{opacity:0}
.hint{position:fixed;bottom:25px;font-size:10px}
</style></head>
<body>
<div class="stars"></div><div class="moon"></div>
<div class="envelope" id="envelope">
<div class="back"></div>
<div class="letter">
<div class="header"><h1>4THMOTMOT</h1><p>For Shayne — my light, my joy, and my greatest gift.</p></div>
<img class="photo" src="knight_princess.png" alt="">

<div class="flap"></div><div class="seal">J &amp; S</div></div>
<div class="hint">CLICK THE WAX SEAL</div>
<script>
document.getElementById('envelope').addEventListener('click',e=>{
 e.currentTarget.classList.add('open');
});
</script>
</body></html>
